config_version = 20

[bar.default]
background_opacity = 0.74999998323619366
end = [ "control-center", "tray", "clipboard", "volume", "ram", "weather", "session" ]
scale = 1.0500000081956387
start = [ "wallpaper", "workspaces", "media" ]
thickness = 31

[location]
address = "Гомель"

[lockscreen]
wallpaper = "/home/arch/Wallpapers/secluded-grove-pixel.png"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 898.0
    output = "Virtual-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
avatar_path = "/home/arch/Wallpapers/gruv-dev-minimal.png"
font_family = "JetBrains Mono NL Medium"
lang = "ru"

    [shell.panel]
    transparency_mode = "soft"

[theme]
builtin = "Gruvbox"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk4", "niri", "qt" ]

[wallpaper]
directory = "/home/arch/Wallpapers"
transition_duration = 1600

    [wallpaper.default]
    path = "/home/arch/Wallpapers/pixelart/secluded-grove-pixel.png"

    [wallpaper.last]
    path = "/home/arch/Wallpapers/pixelart/secluded-grove-pixel.png"

    [wallpaper.monitors.Virtual-1]
    path = "/home/arch/Wallpapers/pixelart/secluded-grove-pixel.png"

[widget.clipboard]
color = "on_surface_variant"

[widget.control-center]
color = "on_surface_variant"

[widget.ram]
color = "on_primary_container"

[widget.session]
color = "primary_container"

[widget.tray]
color = "primary"

[widget.volume]
color = "on_secondary_container"

[widget.wallpaper]
color = "secondary"

[widget.weather]
color = "tertiary"
max_length = 123
show_condition = false